global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: "/v1/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "gateway:8080"

  - job_name: "mock-vllm"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "mock-vllm:8000"