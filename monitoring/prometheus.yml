global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    metrics_path: "/v1/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "gateway:8080"

  # Active when mock profile is up (docker compose --profile mock).
  - job_name: "mock-vllm"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "mock-vllm:8000"

  # vLLM Metal on the Mac host (chat + embeddings servers).
  - job_name: "vllm-metal"
    metrics_path: "/metrics"
    scheme: "http"
    static_configs:
      - targets:
          - "host.docker.internal:8000"
          - "host.docker.internal:8001"
